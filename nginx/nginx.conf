# Отключаем лишние дефолтные настройки
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Базовые настройки
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Логи
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

    # Отключаем версию nginx в ответах
    server_tokens off;

    # Upstream бэкенда (можно использовать напрямую proxy_pass)
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    # Основной сервер
    server {
        listen 80;
        server_name localhost;

        # Проксирование всех запросов на бэкенд
        location / {
            proxy_pass http://backend;

            # Стандартные заголовки для прокси
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Буферизация
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Healthcheck endpoint для nginx
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}